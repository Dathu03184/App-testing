<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Green gradient background circle -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg)" />

  <!-- Outer decorative ring -->
  <circle cx="50" cy="50" r="44" stroke="white" stroke-width="2.5" fill="none" opacity="0.4" />

  <!-- Brain top hemisphere (outline) -->
  <path
    d="M 38 48 C 30 48, 28 36, 36 30 C 32 24, 44 18, 50 24 C 56 18, 68 24, 64 30 C 72 36, 70 48, 62 48 C 62 52, 38 52, 38 48 Z"
    fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- Brain center divide line -->
  <path d="M 50 24 L 50 48" stroke="white" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />

  <!-- Left brain detail -->
  <path d="M 36 38 C 42 38, 44 34, 48 36" stroke="white" stroke-width="1.8" fill="none" />

  <!-- Right brain detail -->
  <path d="M 64 38 C 58 38, 56 34, 52 36" stroke="white" stroke-width="1.8" fill="none" />

  <!-- Lower body / stem (solid white) -->
  <path
    d="M 24 56 C 24 74, 42 82, 50 82 C 58 82, 76 74, 76 56 C 76 52, 72 50, 70 54 C 66 62, 58 70, 50 70 C 42 70, 34 62, 30 54 C 28 50, 24 52, 24 56 Z"
    fill="white"
  />

  <!-- Small heart / pulse mark -->
  <path
    d="M 50 75 C 50 75, 47 72, 45 70 C 43 68, 45 66, 47 66 C 49 66, 50 68, 50 68 C 50 68, 51 66, 53 66 C 55 66, 57 68, 55 70 C 53 72, 50 75, 50 75 Z"
    fill="#059669" opacity="0.6"
  />
</svg>